services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  airflow-init:
    image: apache/airflow:3.0.4
    depends_on: [postgres, redis]
    env_file: [.env]
    entrypoint: /bin/bash
    command: >
      -c "
      airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User
      --role Admin --email admin@example.com --password admin &&
      bash /opt/airflow/scripts/init_connections.sh
      "
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/include:/opt/airflow/include
      - ./airflow/scripts:/opt/airflow/scripts
      - ./airflow/requirements.txt:/requirements.txt

  airflow-webserver:
    image: apache/airflow:3.0.4
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: [.env]
    ports: ["8080:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/include:/opt/airflow/include
      - ./airflow/requirements.txt:/requirements.txt
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    image: apache/airflow:3.0.4
    depends_on: [airflow-webserver]
    env_file: [.env]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/include:/opt/airflow/include
      - ./airflow/requirements.txt:/requirements.txt
    command: scheduler

  airflow-triggerer:
    image: apache/airflow:3.0.4
    depends_on: [airflow-webserver]
    env_file: [.env]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/include:/opt/airflow/include
    command: triggerer

  airflow-worker:
    image: apache/airflow:3.0.4
    depends_on: [airflow-scheduler]
    env_file: [.env]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/include:/opt/airflow/include
    command: celery worker

volumes:
  pgdata:
