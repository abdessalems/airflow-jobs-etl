[project]
name = "jobs-etl"
version = "0.1.0"
description = "ETL to scrape Python job postings, clean, store in Postgres, export CSV"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pandas>=2.2",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "boto3>=1.34",
  "pydantic>=2.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E","F","I","UP"]
